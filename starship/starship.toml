"$schema" = "https://starship.rs/config-schema.json"
# Managed in the toolkit's starship/starship.toml (symlinked to ~/.config/starship.toml).
#
#  …/shop-api  github main !?   v3.12.3 (env)  󱃾 shop-dev · flux-system  󰅣 shop-dev-ro 3h5m         4s  16:42
#  ❯
#
# Prod is loud: a red PROD badge before the AWS profile (set by the okcli hook)
# and the kube context turns red with a warning sign on *prod* clusters.

scan_timeout = 50
command_timeout = 500
# The blank line between prompts comes from shell/init.sh instead, which skips it
# before the first prompt (so a new terminal starts at the top).
add_newline = false
palette = "custom1"

format = """\
$directory\
( [·](244) ${custom.giturl}$git_branch${custom.git_worktree}$git_state)\
( [·](244) $python)( [·](244) $nodejs)( [·](244) $golang)( [·](244) $rust)( [·](244) $docker_context)\
( [·](244) $kubernetes)\
( [·](244) ${env_var.OKCLI_AWS}${env_var.OKCLI_AWS_PROD}${env_var.OKCLI_AWS_EXPIRED}${env_var.OKCLI_AWS_LEFT}${env_var.OKCLI_AWS_LEFT_LOW})\
$fill\
($jobs )$cmd_duration\
$line_break\
$character"""

[fill]
symbol = " "

[directory]
style = "bold sapphire"
read_only = "󰌾 "
read_only_style = "red"
format = "[$read_only]($read_only_style)[$path]($style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
style = "bold mauve"
format = "[$branch]($style)"

[git_state]
style = "bold peach"
format = "[ $state( $progress_current/$progress_total)]($style)"

[git_status]
style = "text"
format = "([ $conflicted$untracked$staged$modified$renamed$deleted$stashed$ahead_behind]($style))"
staged     = "[+$count](green)"
modified   = "[!$count](yellow)"
renamed    = "[»$count](blue)"
deleted    = "[-$count](red)"
untracked  = "[?$count](red)"
stashed    = "[≡](lavender)"
conflicted = "[✖$count](red bold)"
ahead      = "[⇡$count](teal)"
behind     = "[⇣$count](peach)"
diverged   = "[⇕⇡$ahead_count⇣$behind_count](mauve)"

[python]
symbol = " "
style = "yellow"
version_format = "v${raw}"
format = "[$symbol$version( \\($virtualenv\\))]($style)"

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style)"

[golang]
symbol = " "
style = "sky"
format = "[$symbol$version]($style)"

[rust]
symbol = " "
style = "peach"
format = "[$symbol$version]($style)"

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style)"

[package]
disabled = true

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "teal"
format = "[$symbol$context]($style)"

# First match wins. EKS ARNs are cut down to the cluster name.
[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:[^:]+:[0-9]+:cluster/(?P<var_cluster>.*(prod|prd).*)"
context_alias = "$var_cluster"
style = "bold red"

[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:[^:]+:[0-9]+:cluster/(?P<var_cluster>.+)"
context_alias = "$var_cluster"

[[kubernetes.contexts]]
context_pattern = ".*(prod|prd).*"
style = "bold red"

# AWS profile, colored by the okcli shell hook, which sets exactly one of these.
[aws]
disabled = true

[env_var.OKCLI_AWS]
format = "[󰅣 $env_value](peach)"

[env_var.OKCLI_AWS_PROD]
format = "[󰅣 $env_value](bold red)"

[env_var.OKCLI_AWS_EXPIRED]
format = "[󰅣 $env_value](peach)[ expired](bold red)"

# Time the login has left, from the same hook: green, yellow under 30 minutes.
[env_var.OKCLI_AWS_LEFT]
format = " [$env_value](green)"

[env_var.OKCLI_AWS_LEFT_LOW]
format = " [$env_value](yellow)"

[jobs]
symbol = "✦"
style = "bold blue"
format = "[$symbol$number]($style)"

[cmd_duration]
min_time = 2000
# Bright and bold: the muted overlay colours vanish on a background image.
style = "bold text"
format = "[ $duration]($style) "

[time]
disabled = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[custom.giturl]
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=""
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=""
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=""
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=""
else
    GIT_REMOTE_SYMBOL=""
fi
echo "$GIT_REMOTE_SYMBOL "
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
shell = ["bash", "--noprofile", "--norc"]
style = "white"
format = "[$output ]($style)"
require_repo = true
ignore_timeout = true


[custom.git_worktree]
description = "Show indicator when inside a git worktree"
command = """
if git rev-parse --git-dir >/dev/null 2>&1; then
      common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
      git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
      if [ "$common_dir" != "$git_dir" ]; then
            echo "⛓ "
      fi
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "( [$output]($style))"
style = "bold green"
require_repo = true
ignore_timeout = true

