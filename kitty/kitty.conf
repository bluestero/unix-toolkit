# --- Fonts ---
font_family      JetBrainsMono Nerd Font
font_size        9.5

# --- Window Layout ---
window_padding_width 12
remember_window_size  no
initial_window_width  1200
initial_window_height 600
hide_window_decorations yes

# --- Tab Bar (hide if you use tmux for tabs) ---
tab_bar_edge bottom
tab_bar_style powerline
# Always shown: a bar that appears with the 2nd tab shrinks the window by a
# row, and pickers drawn in place (kx lists) leave a stray line behind.
tab_bar_min_tabs 1
# tab_bar_style hidden

# --- Look ---
# Keep this below 1: it lets kitty's window be see-through at all. With a
# background image, how see-through it is comes from k-bg opacity (baked into the
# image); this value itself only shows with no image (k-bg off).
background_opacity 0.95

# A short streak follows the cursor when it jumps, so you can see where it went.
# Only for a cursor that sat still this many ms (no flicker while apps redraw); 0 = off.
cursor_trail 3

# Scrollbar on the right: shows once you scroll up, or when the mouse is near the
# edge so you can grab it. Other values: scrolled, always, never.
scrollbar scrolled-or-hovered

# --- Colour theme (pick one with k-theme; the choice lives in theme.conf) ---
# Before background.conf, so k-bg accents win for the cursor, selection and tabs.
globinclude theme.conf

# --- Background image (pick one with k-bg; the choice lives in background.conf) ---
background_image_layout cscaled
background_tint 0
globinclude background.conf
# k-bg and k-theme preview through remote control, over a private socket per kitty
# (KITTY_LISTEN_ON). Each password allows only what its tool needs: k-bg the
# background image and colours, k-theme colours, kx opening a tab; anything else is refused.
listen_on unix:@kitty-{kitty_pid}
allow_remote_control password
remote_control_password "k-bg" set-background-image set-colors
remote_control_password "k-theme" set-colors
remote_control_password "kx" launch
enable_audio_bell no

# --- Reset Defaults to Prevent Conflicts ---
clear_all_shortcuts no

# --- Tab Customizations (Capitalized Key Identifiers) ---
map ctrl+w close_window
map ctrl+shift+w close_os_window
map ctrl+n new_tab
map ctrl+shift+n new_os_window
map ctrl+shift+r set_tab_title

# Switch tabs (browser style)
map ctrl+page_up   previous_tab
map ctrl+page_down next_tab

# Move the current tab left / right
map ctrl+shift+page_up   move_tab_backward
map ctrl+shift+page_down move_tab_forward

# --- Terminal Splits ---
map ctrl+shift+enter new_window
map ctrl+[ previous_window
map ctrl+] next_window

# --- Full screen and search ---
# Full screen: same key again leaves it (Escape is left to the programs inside).
# Maximizing is done by the window manager (super+up).
map ctrl+alt+f toggle_fullscreen
map ctrl+shift+f search_scrollback
# The scrollback opens in less: matches shown black on yellow, case ignored
# even when the search has capitals.
scrollback_pager less --use-color -DSky -I --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# --- Delete a word ---
# ctrl+backspace acts like alt+backspace (programs like less and fzf get the same key)
map ctrl+backspace send_text all \x1b\x7f

# --- Smart Copy & Paste ---
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

# Ctrl+Shift+drag selects a rectangle, also inside pickers (fzf) that take the
# mouse: copies just the text in a pane, without box borders or the list next
# to it. (kitty's own key is Ctrl+Alt+drag, Ctrl+Alt+Shift+drag in pickers.)
# Ctrl+Shift+click still opens links.
mouse_map ctrl+shift+left press grabbed,ungrabbed mouse_selection rectangle

# --- Your patch (tk configs: edit my patch), last so it wins; this file stays the toolkit's ---
globinclude ../work-toolkit/patches/kitty.conf
